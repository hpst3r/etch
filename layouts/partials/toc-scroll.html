{{- if partial "has-toc.html" . -}}
<script>
(function () {
    var links = Array.from(document.querySelectorAll('.toc #TableOfContents a'));
    if (!links.length) return;

    var pairs = links.map(function (link) {
        var id;
        try {
            id = decodeURIComponent(new URL(link.href, window.location.href).hash.slice(1));
        } catch (error) {
            return null;
        }
        return { link: link, heading: document.getElementById(id) };
    }).filter(function (pair) { return pair && pair.heading; });

    if (!pairs.length) return;

    var scheduled = false;
    var currentLink = null;

    function setCurrent(pair) {
        pairs.forEach(function (item) {
            var active = item === pair;
            item.link.classList.toggle('toc-active', active);
            if (active) {
                item.link.setAttribute('aria-current', 'location');
            } else {
                item.link.removeAttribute('aria-current');
            }
        });

        if (pair.link !== currentLink) {
            currentLink = pair.link;
            var toc = pair.link.closest('.toc');
            if (toc && toc.scrollHeight > toc.clientHeight) {
                var linkTop = pair.link.offsetTop;
                var linkBottom = linkTop + pair.link.offsetHeight;
                if (linkTop < toc.scrollTop) {
                    toc.scrollTop = linkTop;
                } else if (linkBottom > toc.scrollTop + toc.clientHeight) {
                    toc.scrollTop = linkBottom - toc.clientHeight;
                }
            }
        }
    }

    function updateCurrent() {
        scheduled = false;
        var threshold = Math.min(window.innerHeight * 0.3, 160);
        var current = pairs[0];

        pairs.forEach(function (pair) {
            if (pair.heading.getBoundingClientRect().top <= threshold) {
                current = pair;
            }
        });

        if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
            current = pairs[pairs.length - 1];
        }

        setCurrent(current);
    }

    function scheduleUpdate() {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(updateCurrent);
    }

    window.addEventListener('scroll', scheduleUpdate, { passive: true });
    window.addEventListener('resize', scheduleUpdate);
    window.addEventListener('hashchange', scheduleUpdate);
    window.addEventListener('popstate', scheduleUpdate);
    scheduleUpdate();
})();
</script>
{{- end -}}
